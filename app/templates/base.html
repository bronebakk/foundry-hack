<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Northgate Futures — Keyworker Workbench{% endblock %}</title>
  <link rel="stylesheet" href="/static/base.css" />
  <!-- HTMX, self-hosted (no runtime CDN): in-place swaps without a SPA bundle -->
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body>
  <!-- Persistent, unmissable synthetic-data marker (Invariant 3 / VAL-GOV-001) -->
  <div class="synthetic-banner" role="note">
    🧪 SYNTHETIC DEMO DATA — every persona and record here is entirely fictional. No real people, no real client data.
  </div>

  {% include "_nav.html" %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <div class="container">
      The AI <strong>proposes</strong>; the worker <strong>disposes</strong>.
      Open-weight inference (<code>gpt-oss-120b</code>), self-hostable. Worker of record: {{ worker }}.
    </div>
  </footer>
</body>
</html>
