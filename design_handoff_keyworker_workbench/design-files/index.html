<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northgate Futures — Keyworker Workbench (refined)</title>
  <link rel="stylesheet" href="kit-refined.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="data.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="surfaces.jsx"></script>
  <script type="text/babel" src="surfaces2.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    const SEED_LOG = [
      { persona: "Marcus Fielding", surface: "escalation", type: "follow_up", disposition: "escalate",
        proposal: "Funded place 16–19 only; alternatives exist.",
        final: "Please review Marcus's adult funding routes (Advanced Learner Loan, bursary, apprenticeship) and come back to him with a route and a reason.", when: "2026-06-03" },
      { persona: "Leah Sumner", surface: "escalation", type: "risk_flag", disposition: "escalate",
        proposal: "CSE/CCE concern surfaced from drop-in note leah-r2.",
        final: "Escalating to the safeguarding lead today — older male, gifts, unexplained money, overnight stays at an unknown address. My decision to refer.", when: "2026-06-03" },
    ];

    function App() {
      const [route, setRoute] = useState("caseload");
      const [pid, setPid] = useState(null);
      const [log, setLog] = useState(SEED_LOG);
      const go = (r, id) => {
        if (id !== undefined) setPid(id);
        if (["context","drafting","safeguarding"].includes(r) && id === undefined && !pid) setPid("leah-sumner");
        setRoute(r); window.scrollTo(0, 0);
      };
      const addLog = (entry) => setLog((l) => [{ ...entry, when: entry.when || "2026-06-03" }, ...l]);
      const persona = byId(pid) || byId("leah-sumner");

      let view;
      if (route === "caseload") view = <Caseload go={go} />;
      else if (route === "context") view = <Context persona={persona} go={go} />;
      else if (route === "drafting") view = <Drafting persona={persona} go={go} addLog={addLog} />;
      else if (route === "safeguarding") view = persona.noDeny
          ? <NoDeny persona={persona} go={go} addLog={addLog} />
          : <Safeguarding persona={persona} go={go} addLog={addLog} />;
      else if (route === "inbox") view = <Inbox go={go} log={log} />;
      else if (route === "log") view = <DecisionLog go={go} log={log} />;
      else view = <Caseload go={go} />;

      const showArc = ["context","drafting","safeguarding"].includes(route);
      return (
        <React.Fragment>
          <Banner />
          <TopBar route={route} go={go} />
          <main className="container">
            {showArc && <ArcStepper persona={persona} route={route} go={go} />}
            <div style={{ paddingTop: showArc ? 0 : "1.6rem" }}>{view}</div>
          </main>
          <Footer />
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
